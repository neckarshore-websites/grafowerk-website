name: E2E (Playwright)

# Per-PR + push-to-main gate: runs the local Playwright suite (tests/e2e/) against
# a dev server. Part of the from-scratch family-CI port to grafowerk-website
# (2026-06-24) — until now the suite ran only on developer machines and blocked
# no merge. Mirrors the e2e gate on the other estate sites.
#
# The dev server is managed by playwright.config.ts (`webServer: npm run dev`,
# reuseExistingServer off under CI). The contact form's smoke test deliberately
# submits WITHOUT consent and asserts the validation error — it never sends mail,
# so no SMTP creds are needed and the run is deterministic with no third-party
# hosts.
#
# `test:e2e:ci` = `playwright test --grep-invert @external`. grafowerk's local
# suite has no @external-tagged tests today (the prod/real-host run is the
# separate `test:smoke` against grafowerk.de), but the flag keeps the family CI
# contract identical across all sites.

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Break the emit commit-loop: the emit-stats job below commits a stats.json-only
    # commit to main; paths-ignore keeps that commit from re-triggering this workflow
    # (cleaner than a [skip ci] string convention). estate stats-json-contract, Phase 3.
    paths-ignore:
      - 'stats.json'
  pull_request:
    branches: [main]

# Least-privilege default token — the e2e job only reads the repo. emit-stats re-grants
# contents:write for its job only (job-scoped, never workflow-wide).
permissions:
  contents: read

concurrency:
  # Cancel superseded PR runs; let every push-to-main run complete (each main
  # commit stays gated).
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        # No --with-deps: the runner image already carries Chromium's libraries. The flag only fetched
        # font packages from an Ubuntu mirror that stalled this step for 5 to 14 minutes
        # in 26 of 524 runs across the websites, 2026-10-23 to 2026-11-06.
        run: npx playwright install chromium

      - name: Run E2E tests (excludes @external)
        run: npm run test:e2e:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Estate stats.json producer (test-scope facet, backlog #391 Lane 3 / direct-to-main).
  # main is public + UNPROTECTED, so the CI bot commits stats.json straight to main on every
  # push:main, AFTER the e2e gate. Runs even when e2e fails (if: always) so a non-green run
  # emits red:true — never a stale-green count. contents:write is scoped to THIS job only;
  # the workflow-level paths-ignore on stats.json breaks the re-trigger loop. Mirrors the
  # md-viewer direct-to-main precedent.
  #
  # WHAT IS COUNTED: the Playwright e2e suite this job's `e2e` gate runs (`test:e2e:ci` =
  # `--grep-invert @external`), enumerated via `playwright test --list` (the authoritative
  # "Total: N tests" summary — never grep). Count-set == gate-set. The Node unit suite(s), if
  # any, use ad-hoc `check()` / node:test reporters that no test-stats-action adapter parses
  # yet — deliberately NOT counted here; needs a node:test/ok-summary adapter (AP-1) + a
  # one-line runners: addition. The emitted total is an honest e2e floor until then.
  # Contract: https://github.com/neckarshore-ai/neckarshore-planning/blob/main/docs/reference/stats-json-contract.md
  emit-stats:
    name: Emit stats.json (estate producer)
    needs: e2e
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      # Serialize emits so two rapid pushes cannot race on the git push to stats-data.
      group: emit-stats-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Enumerate the GATED e2e suite for its count. `--list` collects only (no server, no
      # browser) — it prints the authoritative "Total: N tests in M files" the action parses.
      # The e2e EXECUTION result comes from needs.e2e.result (the gate job above). The
      # `--grep-invert @external` selection is exactly what test:e2e:ci gates.
      - name: Capture e2e reporter (playwright --list)
        run: npx playwright test --grep-invert @external --list > /tmp/e2e-list.out 2>&1 || true

      # Die EINE gegatete Unit-Suite dieses Repos. Sie haengt in lighthouse.yml, nicht in einem
      # unit.yml — das gibt es hier nicht. `needs:` greift NICHT workflow-uebergreifend, dieser Job
      # muss sie also selbst fahren; das ist die einzige Art, an ihre Zahl zu kommen.
      # `|| true`: ein roter Lauf soll trotzdem eine stats.json schreiben; die Rotfaerbung traegt
      # sich selbst ueber fail>0 im Reporter.
      # NICHT mitgezaehlt: test:smoke / test:smoke:local sind Playwright mit --grep @smoke und damit
      # eine TEILMENGE der schon gezaehlten e2e-Suite. Als eigene runners:-Zeile waeren sie eine
      # Doppelzaehlung und wuerden die Disjunktheit der Gesamtzahl brechen (#14).
      - name: Capture node-test reporter (gated unit suite)
        run: npm run test:lighthouse:unit > /tmp/lighthouse-unit.out 2>&1 || true

      # The two node --test suites lint.yml gates (test:honeypot, test:agent-rules) were not
      # counted until 2026-11-24 (website test plan, gap row 3: "grafowerk misses 2").
      - name: Capture node-test reporters (suites gated in lint.yml)
        run: |
          npm run test:honeypot > /tmp/honeypot-unit.out 2>&1 || true
          npm run test:agent-rules > /tmp/agent-rules-unit.out 2>&1 || true

      # Pinned to the full commit SHA of test-stats-action (third-party actions are SHA-pinned,
      # never tag-floated). 54ae407 is the PIR-passed pin — the same pin md-viewer + trustscope
      # Bumped 54ae407 -> 893875d on 2026-09-22: der alte Pin liegt vor den node-test/tsx-Adaptern
      # (6130f0f, 2026-07-18) und haette den Unit-Reporter ignoriert (#14).
      # declared left empty: no executed-but-ungated suite is counted.
      - name: Emit stats.json
        uses: neckarshore-ai/test-stats-action@893875deeeaed23438bb02fbb988dfa143a53fd7
        with:
          repo: ${{ github.repository }}
          out: stats.json
          sha: ${{ github.sha }}
          test_result: ${{ needs.e2e.result }}
          runners: |
            e2e:playwright:/tmp/e2e-list.out
            unit:node-test:/tmp/lighthouse-unit.out
            unit:node-test:/tmp/honeypot-unit.out
            unit:node-test:/tmp/agent-rules-unit.out

      # Structural contract gate — invariants that hold on BOTH green and red runs. Deliberately
      # does NOT assert a golden total (a red run legitimately undercounts and must still emit).
      - name: Validate emitted stats.json against the contract
        run: |
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .repo == $repo
            and (.audited_sha | type == "string" and length > 0)
            and (.tests.total == ([.tests.byType[]] | add))
            and (.tests.byType | has("e2e"))
            and (.tests.declared == {})
            and (.red | type == "boolean")
          ' stats.json > /dev/null \
            || { echo "::error::stats.json failed contract validation"; cat stats.json; exit 1; }
          echo "stats.json is contract-valid:"; cat stats.json

      # Publish stats.json to the UNPROTECTED `stats-data` branch with git plumbing (one blob,
      # one tree, one commit), never to main: main gets a ruleset with required checks (website
      # test plan, gap rows 2 and 3), and a bot write to main would be refused. Same step as
      # neckarshore-website and oakwoodgolfclub-website. Vercel must not build this branch: that is
      # the project's "Ignored Build Step" setting, not a vercel.json (measured on oakwood 2026-09-10).
      - name: Publish stats.json to the stats-data branch when it changed
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"
        run: |
          set -euo pipefail
          norm() { jq -S 'del(.updatedAt)' "$1" 2>/dev/null; }
          # Reliably materialize refs/remotes/origin/stats-data (a bare `fetch <branch>` only sets
          # FETCH_HEAD). Fails harmlessly on the first run (the branch does not exist yet).
          git fetch origin +refs/heads/stats-data:refs/remotes/origin/stats-data 2>/dev/null || true
          if git show origin/stats-data:stats.json > /tmp/prev-stats.json 2>/dev/null \
             && [ "$(norm /tmp/prev-stats.json)" = "$(norm stats.json)" ]; then
            echo "stats.json unchanged (ignoring timestamp) — nothing to publish."
            exit 0
          fi
          BLOB=$(git hash-object -w stats.json)
          TREE=$(printf '100644 blob %s\tstats.json\n' "$BLOB" | git mktree)
          MSG="chore(stats): emit stats.json @ ${GITHUB_SHA:0:7}"
          if git rev-parse --verify origin/stats-data >/dev/null 2>&1; then
            COMMIT=$(git commit-tree "$TREE" -p origin/stats-data -m "$MSG")
          else
            COMMIT=$(git commit-tree "$TREE" -m "$MSG")
          fi
          # Belt: a git push with an EMPTY source refspec (":refs/heads/stats-data") is a DELETE
          # command — an empty $COMMIT would delete stats-data instead of updating it. `set -e`
          # already aborts on a failed commit-tree substitution; this is the explicit guard so a
          # branch deletion can never depend on implicit -e.
          [ -n "$COMMIT" ] || { echo "::error::commit-tree produced no commit — refusing to push (would delete stats-data)"; exit 1; }
          git push origin "${COMMIT}:refs/heads/stats-data"
